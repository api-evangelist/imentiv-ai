  - type: Documentation
    url: https://imentiv.ai/
- aid: imentiv-ai:imentiv-ai-text-emotion-api-api
  name: Imentiv AI Text Emotion API API
  description: >-
    The Text Emotion Analysis API by Imentiv analyzes a given piece of text and returns the detected emotional
    tone(s).


    **Features:**

    - The API processes the text, detects emotions for each paragraph, and returns results.

    - A callback mechanism is supported for asynchronous analysis.

    - **Supported emotions (28):** Admiration, Amusement, Approval, Caring, Desire, Excitement, Gratitude,
    Joy/Happy, Love, Optimism, Pride, Relief, Anger, Disappointment, Annoyance, Disapproval, Disgust,
    Embarrassment, Fear, Grief, Nervousness, Remorse, Sadness, Confusion, Curiosity, Realization, Surprise,
    Neutral
  humanURL: https://imentiv.ai/
  baseURL: https://api.imentiv.ai
  tags:
  - Text Emotion API
  properties:
  - type: OpenAPI
    url: openapi/imentiv-ai-text-emotion-api-api-openapi.yml
  - type: Documentation
    url: https://imentiv.ai/
- aid: imentiv-ai:imentiv-ai-video-emotion-api-api
  name: Imentiv AI Video Emotion API API
  description: >-
    The Video Emotion Analysis API by Imentiv analyzes the emotional states of individuals in a video.
    It performs multi-modal emotion detection using facial expressions, audio, and text transcript, and
    has the following features:


    - Overall emotion summary

    - Frame-by-frame emotion data

    - Per-face emotional analysis

    - Valence-arousal-intensity data

    - Audio and transcript emotion data

    - Personality analysis

    - Video Highlights

    - Optional psychological insights
  humanURL: https://imentiv.ai/
  baseURL: https://api.imentiv.ai
