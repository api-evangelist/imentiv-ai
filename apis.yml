- aid: imentiv-ai:imentiv-ai-report-api-api
  name: Imentiv AI Report API API
  description: >-
    The Report API provides comprehensive emotion analysis reports in PDF format for analyzed media content.


    **Features:**

    - Generate detailed PDF reports for video emotion analysis

    - Includes visual charts, emotion timelines, and insights

    - Supports asynchronous report generation with callback notifications

    - Retrieve existing reports or trigger new generation


    **Use Cases:** Ideal for creating shareable analysis reports, documentation of emotional insights,
    and presentation-ready materials.
  humanURL: https://imentiv.ai/
  baseURL: https://api.imentiv.ai
