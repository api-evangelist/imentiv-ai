apis:
- aid: imentiv-ai:imentiv-ai-ai-insights-api-api
  name: Imentiv AI AI Insights API API
  description: >-
    The AI Insights API provides conversational AI-powered analysis of emotional data from your media
    content.


    **Features:**

    - Ask natural language questions about detected emotions, patterns, and trends

    - Receive AI-generated insights with real-time streaming (SSE)

    - Conversation continuity across multiple messages

    - Works with all media types: video, audio, image, and text


    **Endpoints:**

    - `POST /v2/{media_type}/{media_id}/ai-insights` - Send a message and receive AI response (streaming
    recommended)

    - `GET /v2/{media_type}/{media_id}/ai-insights` - Retrieve conversation history


    **Use Cases:** Ideal for gaining deeper insights into emotional patterns, generating summaries, comparing
    emotional states, and understanding sentiment trends in your media content.
  humanURL: https://imentiv.ai/
  baseURL: https://api.imentiv.ai
  tags:
  - AI Insights API
  properties:
  - type: OpenAPI
    url: openapi/imentiv-ai-ai-insights-api-api-openapi.yml
  - type: Documentation
    url: https://imentiv.ai/
- aid: imentiv-ai:imentiv-ai-audio-emotion-api-api
  name: Imentiv AI Audio Emotion API API
  description: >-
    The Audio Emotion Analysis API processes audio files or YouTube URLs to analyze emotions and transcripts.
    The API provides:


    **Speaker Diarization:** Identifies and segments audio by speakers.


    **Audio Emotion Analysis:** Detects one of 8 emotions per audio segment.


    **Text Emotion Analysis:** Generates a transcript for each segment and detects one of 28 emotions
    from the text.
  humanURL: https://imentiv.ai/
  baseURL: https://api.imentiv.ai
  tags:
  - Audio Emotion API
  properties:
  - type: OpenAPI
    url: openapi/imentiv-ai-audio-emotion-api-api-openapi.yml
  - type: Documentation
    url: https://imentiv.ai/
- aid: imentiv-ai:imentiv-ai-image-emotion-api-api
  name: Imentiv AI Image Emotion API API
  description: >-
    The Image Emotion Recognition API by Imentiv analyzes human facial expressions in an image and returns
    the detected emotions. It can detect multiple faces and evaluate each face's emotional state, providing
    detailed emotional labels such as happy, sad, angry, neutral, surprise, disgust, fear, and contempt.
  humanURL: https://imentiv.ai/
  baseURL: https://api.imentiv.ai
  tags:
